robot:
  ur_ip: 192.168.10.112
  use_network_robot: true
  network_robot_ip: 192.168.10.100
  network_robot_port: 5553
  watchdog_hz: 100.0
  
  j_speed: 0.6   # rad/s
  j_accel: 1.0   # rad/s^2



