
# === Camera configuration ===
camera_drill:
  model: realsense_d435
  serial: "023422070739"           # optional
  # image_mask_path: masks/camera_drill_mask.png
  intrinsics:
    width: 640
    height: 480
    fx: 613.7196044921875
    fy: 613.9456787109375
    cx: 309.51824951171875
    cy: 231.26614379882812
    # width: 1280
    # height: 720
    # fx: 644.92       # 613.7196 × 2
    # fy: 644.92      # 613.9457 × 1.5
